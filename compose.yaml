# Optional local container test. Dokploy Applications use Dockerfile directly.
services:
  app:
    build: .
    ports:
      - "5087:5087"
    environment:
      DP_DB_PATH: /app/data/dp-ops.sqlite
      DP_COOKIE: ${DP_COOKIE:?Set DP_COOKIE in the shell before starting Compose}
      # Local HTTP has no HTTPS proxy: validate against the request's own host.
      # Allows localhost and LAN access while still rejecting foreign origins.
      APP_ORIGIN: ""
      PC_EOS_REPORT_WEBHOOK_URL: ${PC_EOS_REPORT_WEBHOOK_URL:-}
    volumes:
      - dp-ops-data:/app/data
    restart: unless-stopped

volumes:
  dp-ops-data:
